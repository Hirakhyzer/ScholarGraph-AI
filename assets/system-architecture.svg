      <text x="24" y="104" fill="#64748B" font-size="13">metadata + sections</text>
    </g>
    <g transform="translate(640 185)">
      <rect width="180" height="120" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="90" cy="42" r="22" fill="url(#node)"/>
      <text x="28" y="82" fill="#0F172A" font-size="18" font-weight="800">Gap Detector</text>
      <text x="27" y="104" fill="#64748B" font-size="13">limitations + patterns</text>
    </g>
    <g transform="translate(940 185)">
      <rect width="190" height="120" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="95" cy="42" r="22" fill="url(#node)"/>
