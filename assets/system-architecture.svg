<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ScholarGraph AI system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <text x="60" y="78" fill="#0F172A" font-family="Inter, Arial" font-size="34" font-weight="900">ScholarGraph AI — System Architecture</text>
  <text x="60" y="112" fill="#475569" font-family="Inter, Arial" font-size="17">From raw research papers to structured literature intelligence and thesis planning outputs.</text>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)" opacity="0.8">
