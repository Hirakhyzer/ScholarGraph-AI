    <g transform="translate(310 345)">
      <rect width="180" height="120" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="90" cy="42" r="22" fill="url(#node)"/>
      <text x="29" y="82" fill="#0F172A" font-size="18" font-weight="800">Graph Builder</text>
      <text x="34" y="104" fill="#64748B" font-size="13">nodes + relations</text>
