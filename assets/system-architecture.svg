  <rect x="60" y="522" width="1070" height="54" rx="18" fill="#0F172A"/>
  <text x="90" y="556" fill="#E0F2FE" font-family="Inter, Arial" font-size="17" font-weight="700">Output: literature review matrix · research gap report · topic graph · thesis roadmap · exportable academic notes</text>
